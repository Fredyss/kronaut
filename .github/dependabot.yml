version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ['*']
